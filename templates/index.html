<!DOCTYPE html>
<html>
<head>
    <title>Log Manager</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .file-item { margin: 10px 0; padding: 10px; border-bottom: 1px solid #ccc; }
        a { color: #2c3e50; text-decoration: none; margin-right: 10px; }
        a:hover { text-decoration: underline; }
        .stats { color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <h1>📋 Quản lý Log Files</h1>
    <div class="file-list">
        {% for file in files %}
            <div class="file-item">
                📎 <a href="/download/{{ file.filename }}?key={{ api_key }}" download>{{ file.filename }}</a>
                | <a href="/view/{{ file.filename }}?key={{ api_key }}" target="_blank">Xem</a><br>
                <div class="stats">
                    🕐 Thời gian hoạt động: {{ file.duration }} phút
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
